name: Build GYM OS ULTRA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project
        run: |
          unzip -q "$(find . -maxdepth 1 -name '*.zip' | head -1)" -d build_project
          PROJECT_DIR=$(find build_project -type f -name settings.gradle | head -1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: HARD CODE APP NAME
        run: |
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          sed -i 's/android:label="@string\/app_name"/android:label="GYM OS ULTRA"/g' "$MANIFEST"
          sed -i 's/android:label="[^"]*"/android:label="GYM OS ULTRA"/g' "$MANIFEST"

          echo "APP NAME SET TO: GYM OS ULTRA"
          grep 'android:label' "$MANIFEST"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
             "$GITHUB_WORKSPACE/GYM-OS-ULTRA.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GYM-OS-ULTRA-APK
          path: GYM-OS-ULTRA.apk
