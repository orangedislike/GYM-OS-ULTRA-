name: Build GYM OS ULTRA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android project
        run: |
          rm -rf build_project
          mkdir -p build_project

          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Android Studio ZIP found!"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d build_project

          PROJECT_DIR=$(find build_project -type f -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Set GYM OS ULTRA app name
        run: |
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found!"
            exit 1
          fi

          sed -i 's/android:label="@string\/app_name"/android:label="GYM OS ULTRA"/g' "$MANIFEST"
          sed -i 's/android:label="[^"]*"/android:label="GYM OS ULTRA"/g' "$MANIFEST"

          echo "APP NAME:"
          grep 'android:label' "$MANIFEST" || true

      - name: Verify launcher icon
        run: |
          echo "Checking launcher icon resources..."
          grep 'android:icon' "$PROJECT_DIR/app/src/main/AndroidManifest.xml" || true
          find "$PROJECT_DIR/app/src/main/res" -type f | grep -E 'mipmap|icon' || true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --no-daemon

      - name: Find generated APK
        run: |
          echo "Searching for APK..."
          find "$PROJECT_DIR" -type f -name '*.apk' -print

          APK=$(find "$PROJECT_DIR" -type f -name 'app-debug.apk' | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/GYM-OS-ULTRA.apk"

          echo "APK READY:"
          ls -lh "$GITHUB_WORKSPACE/GYM-OS-ULTRA.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GYM-OS-ULTRA-APK
          path: GYM-OS-ULTRA.apk
