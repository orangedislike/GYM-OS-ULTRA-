name: Build GYM OS ULTRA APK

on:
  workflow_dispatch:
  push:
    paths:
     GYM_OS_ULTRA_FINAL_BUILD_Android_Studio_Project.zip
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract latest project
        run: |
          rm -rf build_project
          mkdir build_project
          unzip -q GYM_OS_ULTRA_FINAL_BUILD_Android_Studio_Project.zip -d build_project

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find build_project -type f -name settings.gradle | head -1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT_DIR"

      - name: Verify launcher icon
        run: |
          echo "Checking AndroidManifest:"
          grep 'android:icon' "$PROJECT_DIR/app/src/main/AndroidManifest.xml" || true
          echo "Checking launcher resources:"
          find "$PROJECT_DIR/app/src/main/res" -type f | grep -E 'mipmap|icon_foreground' || true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GYM-OS-ULTRA-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
